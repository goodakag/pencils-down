name: tests

on:
  push:
  pull_request:

jobs:
  gut:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - name: Fetch PDFium-GDE and CC0 art
        run: |
          bash tools/fetch_pdfium_gde.sh
          python3 tools/fetch_assets.py
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Run GUT
        run: ./godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -ginclude_subdirs -gexit
